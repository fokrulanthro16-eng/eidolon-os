version: "3.9"

# EIDOLON OS — Local Infrastructure
# Provides: PostgreSQL 16 + pgvector, Redis 7
# Run: docker compose -f docker/docker-compose.yml up -d

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: eidolon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: eidolon_dev
      POSTGRES_DB: eidolon_os
    ports:
      - "5432:5432"
    volumes:
      - eidolon_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon -d eidolon_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eidolon_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  eidolon_pgdata:
    driver: local
